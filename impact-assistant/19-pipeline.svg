<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Как исходник становится основанием отчёта</title><desc id="desc">Пример: объявленная Python-подписка на DeliveryChanged v1</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">ВСПОМОГАТЕЛЬНЫЕ СЛАЙДЫ  /  IMPACT ASSISTANT</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Как исходник становится основанием отчёта</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Пример: объявленная Python-подписка на DeliveryChanged v1</text><text x="72" y="255" font-size="22" fill="#315CCB" font-weight="700">Преобразование</text><text x="657" y="255" font-size="22" fill="#315CCB" font-weight="700">Конкретный результат</text><path d="M72 277h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="313" font-size="25" fill="#17263D" font-weight="400">Python + конфигурация запуска</text><text x="657" y="313" font-size="25" fill="#17263D" font-weight="400">bus.subscribe(..., &quot;DeliveryChanged&quot;, 1, receive)</text><path d="M72 353h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="389" font-size="25" fill="#17263D" font-weight="400">Извлечение синтаксиса → JSON</text><text x="657" y="389" font-size="25" fill="#17263D" font-weight="400">message_name: DeliveryChanged; message_version: 1</text><path d="M72 429h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="465" font-size="25" fill="#17263D" font-weight="400">Записи → граф Neo4j</text><text x="657" y="465" font-size="25" fill="#17263D" font-weight="400">feature-builder → использует → DeliveryChanged v1</text><path d="M72 505h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="541" font-size="25" fill="#17263D" font-weight="400">Граф → фрагменты → pgvector</text><text x="657" y="541" font-size="25" fill="#17263D" font-weight="400">Текст объекта + основания; вектор из 256 чисел</text><path d="M72 581h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="617" font-size="25" fill="#17263D" font-weight="400">Запрос → поиск → LLM намерения</text><text x="657" y="617" font-size="25" fill="#17263D" font-weight="400">Кандидаты по имени и смыслу; пользователь выбирает</text><path d="M72 657h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="693" font-size="25" fill="#17263D" font-weight="400">Подтверждение → анализ → отчёт</text><text x="657" y="693" font-size="25" fill="#17263D" font-weight="400">Результат правил и отдельный вывод LLM с источниками</text><path d="M72 733h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="804" font-size="23" fill="#566983" font-weight="400">Markdown не извлекает связи в этом POC. Модель получает тексты и ссылки, не векторы.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">19 / 21</text></g></svg>