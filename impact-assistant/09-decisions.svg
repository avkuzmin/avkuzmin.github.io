<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Почему выбрана такая архитектура</title><desc id="desc">Основные решения и их ограничения</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">IMPACT ASSISTANT  /  ДИПЛОМНЫЙ ПРОЕКТ</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Почему выбрана такая архитектура</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Основные решения и их ограничения</text><text x="72" y="295" font-size="22" fill="#315CCB" font-weight="700">Решение</text><text x="562" y="295" font-size="22" fill="#315CCB" font-weight="700">Причина</text><text x="1032" y="295" font-size="22" fill="#315CCB" font-weight="700">Ограничение</text><path d="M72 317h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="362" font-size="26" fill="#17263D" font-weight="400">API и анализ вместе,</text><text x="72" y="400" font-size="26" fill="#17263D" font-weight="400">синхронизация отдельно</text><text x="562" y="362" font-size="26" fill="#17263D" font-weight="400">Меньше сервисов,</text><text x="562" y="400" font-size="26" fill="#17263D" font-weight="400">разные права и нагрузка</text><text x="1032" y="362" font-size="26" fill="#17263D" font-weight="400">Разделять API и анализ</text><text x="1032" y="400" font-size="26" fill="#17263D" font-weight="400">по результатам замеров</text><path d="M72 462h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="507" font-size="26" fill="#17263D" font-weight="400">Задания в PostgreSQL</text><text x="562" y="507" font-size="26" fill="#17263D" font-weight="400">Атомарное сохранение</text><text x="562" y="545" font-size="26" fill="#17263D" font-weight="400">без отдельного брокера</text><text x="1032" y="507" font-size="26" fill="#17263D" font-weight="400">Контроль очереди</text><text x="1032" y="545" font-size="26" fill="#17263D" font-weight="400">и параллельности</text><path d="M72 607h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="652" font-size="26" fill="#17263D" font-weight="400">Граф и векторный поиск</text><text x="562" y="652" font-size="26" fill="#17263D" font-weight="400">Связи и поиск по смыслу</text><text x="562" y="690" font-size="26" fill="#17263D" font-weight="400">дополняют друг друга</text><text x="1032" y="652" font-size="26" fill="#17263D" font-weight="400">pgvector используется в POC.</text><text x="1032" y="690" font-size="26" fill="#17263D" font-weight="400">Хранилище MVP не выбрано</text><path d="M72 752h1456" stroke="#D6E0ED" stroke-width="2"/><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Решение</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">09 / 24</text></g></svg>