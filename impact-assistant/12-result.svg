<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Что доказал работающий прототип</title><desc id="desc">Работоспособность цепочки и качество модели — разные результаты</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">IMPACT ASSISTANT  /  ДИПЛОМНЫЙ ПРОЕКТ</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Что доказал работающий прототип</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Работоспособность цепочки и качество модели — разные результаты</text><text x="72" y="310" font-size="33" fill="#315CCB" font-weight="700">Результат</text><text x="72" y="375" font-size="38" fill="#17263D" font-weight="600">От вопроса в UI до нового сохранённого отчёта.</text><text x="72" y="431" font-size="38" fill="#17263D" font-weight="600">Зависимости и основания доступны при отклонении ответа LLM.</text><text x="72" y="580" font-size="33" fill="#087F86" font-weight="700">Следующий шаг</text><text x="72" y="645" font-size="34" fill="#17263D" font-weight="400">Повысить качество модельных выводов,</text><text x="72" y="695" font-size="34" fill="#17263D" font-weight="400">измерить пользу на реальных изменениях.</text><text x="72" y="800" font-size="23" fill="#566983" font-weight="400">Корпоративное размещение и эксплуатация остаются задачами MVP.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Доказательство</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">12 / 26</text></g></svg>