<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Миграция v1 → v2: пример и пробелы</title><desc id="desc">ProductChanged · регистрации подписок в синтетических исходниках</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">IMPACT ASSISTANT  /  ДИПЛОМНЫЙ ПРОЕКТ</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Миграция v1 → v2: пример и пробелы</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">ProductChanged · регистрации подписок в синтетических исходниках</text><text x="72" y="275" font-size="22" fill="#315CCB" font-weight="700">Что найдено</text><text x="792" y="275" font-size="22" fill="#315CCB" font-weight="700">Следующий шаг</text><path d="M72 297h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="342" font-size="27" fill="#17263D" font-weight="400">feature-builder: ProductChanged v1</text><text x="72" y="380" font-size="27" fill="#17263D" font-weight="400">обработчик читает поле name</text><text x="792" y="342" font-size="27" fill="#17263D" font-weight="400">Перевести подписку и обработчик на v2,</text><text x="792" y="380" font-size="27" fill="#17263D" font-weight="400">проверить работу</text><path d="M72 437h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="482" font-size="27" fill="#17263D" font-weight="400">search-indexer: ProductChanged v2</text><text x="72" y="520" font-size="27" fill="#17263D" font-weight="400">обработчик обновляет индекс</text><text x="792" y="482" font-size="27" fill="#17263D" font-weight="400">Подтвердить применение этой подписки</text><text x="792" y="520" font-size="27" fill="#17263D" font-weight="400">и её работу в окружении</text><path d="M72 577h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="622" font-size="27" fill="#17263D" font-weight="400">Связь с приложением не найдена</text><text x="72" y="660" font-size="27" fill="#17263D" font-weight="400">или версия неясна</text><text x="792" y="622" font-size="27" fill="#17263D" font-weight="400">Уточнить источники и версию.</text><text x="792" y="660" font-size="27" fill="#17263D" font-weight="400">готовность к отключению не подтверждена</text><path d="M72 717h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="795" font-size="23" fill="#566983" font-weight="400">Если найдены только связи с v2, полноту охвата и рабочий трафик всё равно нужно проверить.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">12 / 21</text></g></svg>