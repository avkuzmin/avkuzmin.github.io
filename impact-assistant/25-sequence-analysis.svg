<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Выполнение анализа и сохранение отчёта</title><desc id="desc">MVP · API и анализ — одно приложение; модели — в корпоративном GPUStack</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">ВСПОМОГАТЕЛЬНЫЕ СЛАЙДЫ  /  IMPACT ASSISTANT</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Выполнение анализа и сохранение отчёта</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">MVP · API и анализ — одно приложение; модели — в корпоративном GPUStack</text><rect x="72" y="220" width="236" height="66" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="92" y="247" font-size="20" fill="#17263D" font-weight="400">Пользователь</text><text x="92" y="271" font-size="20" fill="#17263D" font-weight="400">через UI</text><path d="M190 286V767" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><rect x="472" y="220" width="236" height="66" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="492" y="247" font-size="20" fill="#17263D" font-weight="400">Приложение</text><text x="492" y="271" font-size="20" fill="#17263D" font-weight="400">API + анализ</text><path d="M590 286V767" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><rect x="872" y="220" width="236" height="66" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="892" y="247" font-size="20" fill="#17263D" font-weight="400">Хранилища</text><text x="892" y="271" font-size="20" fill="#17263D" font-weight="400">БД / граф / S3</text><path d="M990 286V767" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><rect x="1272" y="220" width="236" height="66" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="1292" y="247" font-size="20" fill="#17263D" font-weight="400">GPUStack</text><text x="1292" y="271" font-size="20" fill="#17263D" font-weight="400">генеративная модель</text><path d="M1390 286V767" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><rect x="85" y="453" width="1435" height="323" fill="none" stroke="#566983" stroke-width="1.5"/><rect x="85" y="453" width="330" height="26" rx="0" fill="#F6F8FC" stroke="#566983" stroke-width="2"/><text x="95" y="472" font-size="17" fill="#315CCB" font-weight="600">par · фоновая работа / опрос</text><path d="M85 690h1435" stroke="#566983" stroke-dasharray="5 5"/><rect x="85" y="690" width="1435" height="86" fill="none" stroke="#566983" stroke-width="1.5"/><rect x="1240" y="690" width="187" height="26" rx="0" fill="#F6F8FC" stroke="#566983" stroke-width="2"/><text x="1250" y="709" font-size="17" fill="#315CCB" font-weight="600">loop · опрос UI</text><path d="M190 326H590" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="390" y="317" text-anchor="middle" font-size="20" fill="#17263D">Подтверждение + ключ повтора</text><path d="M590 364H990" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="790" y="355" text-anchor="middle" font-size="20" fill="#17263D">Проверка основания; ресурс + задание</text><path d="M990 402H590" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="790" y="393" text-anchor="middle" font-size="20" fill="#17263D">Задание принято</text><path d="M590 440H190" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="390" y="431" text-anchor="middle" font-size="20" fill="#17263D">202 · идентификатор анализа</text><path d="M590 481H990" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="790" y="472" text-anchor="middle" font-size="20" fill="#17263D">Аренда; разрешённый контекст версии</text><path d="M990 519H590" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="790" y="510" text-anchor="middle" font-size="20" fill="#17263D">Граф и исходные фрагменты</text><path d="M590 557H1390" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="990" y="548" text-anchor="middle" font-size="20" fill="#17263D">После правил: изменение + контекст</text><path d="M1390 595H590" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="990" y="586" text-anchor="middle" font-size="20" fill="#17263D">Модельный вывод или отказ</text><path d="M590 633H990" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="790" y="624" text-anchor="middle" font-size="20" fill="#17263D">Проверка ответа; сохранить отчёт</text><path d="M990 671H590" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="790" y="662" text-anchor="middle" font-size="20" fill="#17263D">Отчёт и статус опубликованы</text><path d="M190 729H590" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="390" y="720" text-anchor="middle" font-size="20" fill="#17263D">Прочитать состояние</text><path d="M590 763H190" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="390" y="754" text-anchor="middle" font-size="20" fill="#17263D">Текущий статус / готовый отчёт</text><text x="72" y="805" font-size="23" fill="#566983" font-weight="400">Опрос UI идёт независимо от анализа. Чтение сохранённого отчёта не вызывает модель.</text><text x="72" y="837" font-size="23" fill="#566983" font-weight="400">Перед публикацией: доступ, аренда, отмена. Отказ модели сохраняет формальную часть.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">25 / 25</text></g></svg>