" font-weight="400">ServiceAccount → токен Vault</text><text x="1154" y="731" font-size="22" fill="#566983" font-weight="400">Раздельные политики ролей</text><path d="M302 470V544H1020V686H1130" fill="none" stroke="#315CCB" stroke-width="3" marker-end="url(#arrow)"/><text x="340" y="531" font-size="21" fill="#315CCB" font-weight="600">получает секреты</text><path d="M947 437H1060V658H1130" fill="none" stroke="#315CCB" stroke-width="3" marker-end="url(#arrow)"/><text x="981" y="486" font-size="21" fill="#315CCB" font-weight="600">секреты</text><text x="107" y="755" font-size="22" fill="#566983" font-weight="400">Данные требуют резервирования; HA и число экземпляров уточняются.</text><text x="72" y="826" font-size="23" fill="#566983" font-weight="400">Показаны связи с Vault. Доступ к хранилищам и моделям — на C2/C3; IAM и телеметрия — на C1 и слайде 16.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Решение</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">08 / 26</text></g></svg>