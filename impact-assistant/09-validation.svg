<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Проверка и результаты POC</title><desc id="desc">Четыре случая одного снимка. Ручная сверка утверждений с исходниками</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">IMPACT ASSISTANT  /  ДИПЛОМНЫЙ ПРОЕКТ</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Проверка и результаты POC</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Четыре случая одного снимка. Ручная сверка утверждений с исходниками</text><text x="72" y="285" font-size="22" fill="#315CCB" font-weight="700">Проверка</text><text x="582" y="285" font-size="22" fill="#315CCB" font-weight="700">Наблюдение</text><path d="M72 307h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="352" font-size="27" fill="#17263D" font-weight="400">Связи и версии подписок</text><text x="582" y="352" font-size="27" fill="#17263D" font-weight="400">Правила различили старые, новые,</text><text x="582" y="390" font-size="27" fill="#17263D" font-weight="400">неясные и отсутствующие связи</text><path d="M72 447h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="492" font-size="27" fill="#17263D" font-weight="400">Объяснение PriceChanged v2</text><text x="582" y="492" font-size="27" fill="#17263D" font-weight="400">Модель описала подписку</text><text x="582" y="530" font-size="27" fill="#17263D" font-weight="400">и отметила неполноту обзора</text><path d="M72 587h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="632" font-size="27" fill="#17263D" font-weight="400">Корректность утверждений LLM</text><text x="582" y="632" font-size="27" fill="#17263D" font-weight="400">В другом случае модель спутала файл</text><text x="582" y="670" font-size="27" fill="#17263D" font-weight="400">с приложением. Повторная LLM-проверка это пропустила</text><path d="M72 727h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="800" font-size="23" fill="#566983" font-weight="400">Повтор после исправлений выполнен на тех же случаях. Общая точность пока не измерена.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Ключевой слайд</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">09 / 21</text></g></svg>