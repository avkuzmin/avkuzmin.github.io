<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Трудно понять, какие системы затронет изменение</title><desc id="desc">ИИ-ассистент архитектора. Дипломный проект OTUS</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">IMPACT ASSISTANT  /  ДИПЛОМНЫЙ ПРОЕКТ</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Трудно понять, какие системы затронет изменение</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">ИИ-ассистент архитектора. Дипломный проект OTUS</text><text x="72" y="295" font-size="30" fill="#315CCB" font-weight="700">Почему это сложно</text><text x="72" y="353" font-size="32" fill="#17263D" font-weight="400">Сведения разбросаны по документации, коду и настройкам.</text><text x="72" y="401" font-size="32" fill="#17263D" font-weight="400">Архитектор собирает зависимости и уточняет их у команд.</text><text x="72" y="500" font-size="38" fill="#17263D" font-weight="700">Долгий анализ и риск пропустить зависимую систему.</text><text x="72" y="644" font-size="30" fill="#087F86" font-weight="700">Что предлагаем</text><text x="72" y="700" font-size="32" fill="#17263D" font-weight="400">Ассистент находит затронутые системы и связи между ними,</text><text x="72" y="748" font-size="32" fill="#17263D" font-weight="400">показывает источники и отмечает недостающие сведения.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Ключевой слайд</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">01 / 18</text></g></svg>