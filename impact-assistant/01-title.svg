<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">ИИ-ассистент архитектора</title><desc id="desc">Анализ влияния изменений. Архитектура MVP и локальный POC</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">IMPACT ASSISTANT  /  ДИПЛОМНЫЙ ПРОЕКТ</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">ИИ-ассистент архитектора</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Анализ влияния изменений. Архитектура MVP и локальный POC</text><text x="72" y="325" font-size="54" fill="#17263D" font-weight="700">Кого затронет изменение?</text><text x="72" y="470" font-size="22" fill="#315CCB" font-weight="700">Сегодня</text><text x="822" y="470" font-size="22" fill="#315CCB" font-weight="700">С ассистентом</text><path d="M72 492h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="537" font-size="31" fill="#17263D" font-weight="400">Ручной поиск по спецификациям,</text><text x="72" y="582" font-size="31" fill="#17263D" font-weight="400">коду и настройкам. Зависимости</text><text x="72" y="627" font-size="31" fill="#17263D" font-weight="400">и владельцев легко пропустить.</text><text x="822" y="537" font-size="31" fill="#17263D" font-weight="400">Затронутые приложения, цепочки</text><text x="822" y="582" font-size="31" fill="#17263D" font-weight="400">зависимостей и источники.</text><text x="822" y="627" font-size="31" fill="#17263D" font-weight="400">Пробелы указаны явно.</text><path d="M72 674h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="785" font-size="23" fill="#566983" font-weight="400">Пользователи: архитекторы и системные аналитики. Решение принимает человек.</text>