<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Ключевые решения и компромиссы</title><desc id="desc">Решения приняты в ADR; неизвестные параметры MVP остаются явными</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">IMPACT ASSISTANT  /  ДИПЛОМНЫЙ ПРОЕКТ</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Ключевые решения и компромиссы</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Решения приняты в ADR; неизвестные параметры MVP остаются явными</text><text x="72" y="265" font-size="22" fill="#315CCB" font-weight="700">Решение</text><text x="562" y="265" font-size="22" fill="#315CCB" font-weight="700">Причина</text><text x="1032" y="265" font-size="22" fill="#315CCB" font-weight="700">Ограничение</text><path d="M72 287h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="332" font-size="25" fill="#17263D" font-weight="400">API и анализ вместе;</text><text x="72" y="367" font-size="25" fill="#17263D" font-weight="400">синхронизация отдельно</text><text x="562" y="332" font-size="25" fill="#17263D" font-weight="400">Меньше единиц поставки;</text><text x="562" y="367" font-size="25" fill="#17263D" font-weight="400">разные права на знания</text><text x="1032" y="332" font-size="25" fill="#17263D" font-weight="400">Разделить онлайн-роли,</text><text x="1032" y="367" font-size="25" fill="#17263D" font-weight="400">если этого потребуют замеры</text><path d="M72 409h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="454" font-size="25" fill="#17263D" font-weight="400">PostgreSQL для заданий</text><text x="562" y="454" font-size="25" fill="#17263D" font-weight="400">Атомарный приём запроса</text><text x="562" y="489" font-size="25" fill="#17263D" font-weight="400">без отдельного брокера</text><text x="1032" y="454" font-size="25" fill="#17263D" font-weight="400">Ограничивать опрос,</text><text x="1032" y="489" font-size="25" fill="#17263D" font-weight="400">очередь и параллельность</text><path d="M72 531h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="576" font-size="25" fill="#17263D" font-weight="400">Neo4j и векторный поиск</text><text x="562" y="576" font-size="25" fill="#17263D" font-weight="400">Связи и поиск фрагментов</text><text x="562" y="611" font-size="25" fill="#17263D" font-weight="400">решают разные задачи</text><text x="1032" y="576" font-size="25" fill="#17263D" font-weight="400">pgvector — POC;</text><text x="1032" y="611" font-size="25" fill="#17263D" font-weight="400">векторное хранилище MVP позже</text><path d="M72 653h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="698" font-size="25" fill="#17263D" font-weight="400">Модели через GPUStack</text><text x="562" y="698" font-size="25" fill="#17263D" font-weight="400">Использование общей</text><text x="562" y="733" font-size="25" fill="#17263D" font-weight="400">корпоративной платформы</text><text x="1032" y="698" font-size="25" fill="#17263D" font-weight="400">Квоты и привязки MVP</text><text x="1032" y="733" font-size="25" fill="#17263D" font-weight="400">нужно проверить отдельно</text><path d="M72 775h1456" stroke="#D6E0ED" stroke-width="2"/><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">12 / 18</text></g></svg>