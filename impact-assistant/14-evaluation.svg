<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Что показало сравнение правил и модели</title><desc id="desc">Четыре случая одного снимка; исходная серия и проверка исправлений</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">IMPACT ASSISTANT  /  ДИПЛОМНЫЙ ПРОЕКТ</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Что показало сравнение правил и модели</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Четыре случая одного снимка; исходная серия и проверка исправлений</text><text x="72" y="265" font-size="22" fill="#315CCB" font-weight="700">Наблюдение</text><text x="787" y="265" font-size="22" fill="#315CCB" font-weight="700">Что из него следует</text><path d="M72 287h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="332" font-size="24" fill="#17263D" font-weight="400">Правила различили старые, новые,</text><text x="72" y="367" font-size="24" fill="#17263D" font-weight="400">неясные и отсутствующие связи</text><text x="787" y="332" font-size="24" fill="#17263D" font-weight="400">Результат воспроизводится</text><text x="787" y="367" font-size="24" fill="#17263D" font-weight="400">в пределах подготовленных исходников</text><path d="M72 405h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="450" font-size="24" fill="#17263D" font-weight="400">Модель объяснила подписку PriceChanged v2</text><text x="72" y="485" font-size="24" fill="#17263D" font-weight="400">и ограничение неполного обзора</text><text x="787" y="450" font-size="24" fill="#17263D" font-weight="400">Есть полезная интерпретация</text><text x="787" y="485" font-size="24" fill="#17263D" font-weight="400">поверх конкретных строк исходника</text><path d="M72 523h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="568" font-size="24" fill="#17263D" font-weight="400">Модель путала файл с приложением</text><text x="72" y="603" font-size="24" fill="#17263D" font-weight="400">и условия с действиями по исправлению</text><text x="787" y="568" font-size="24" fill="#17263D" font-weight="400">Одобрение повторной LLM-проверки</text><text x="787" y="603" font-size="24" fill="#17263D" font-weight="400">не гарантирует правильность</text><path d="M72 641h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="686" font-size="24" fill="#17263D" font-weight="400">Ссылочные ошибки и отказы сохранены</text><text x="72" y="721" font-size="24" fill="#17263D" font-weight="400">вместе с первичными ответами</text><text x="787" y="686" font-size="24" fill="#17263D" font-weight="400">Ошибки не скрыты; это малая выборка,</text><text x="787" y="721" font-size="24" fill="#17263D" font-weight="400">не оценка корпоративной точности</text><path d="M72 759h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="797" font-size="23" fill="#566983" font-weight="400">Одна версия и права доступа; модель не получает готовые пути и результаты правил.</text><text x="72" y="829" font-size="23" fill="#566983" font-weight="400">Сопоставление утверждений с источниками записано отдельно от автоматического reviewer.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">14 / 21</text></g></svg>