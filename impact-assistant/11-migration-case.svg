<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Что означает полученный отчёт</title><desc id="desc">Статический анализ исходников. PriceChanged v1 / v2</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">IMPACT ASSISTANT  /  ДИПЛОМНЫЙ ПРОЕКТ</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Что означает полученный отчёт</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Статический анализ исходников. PriceChanged v1 / v2</text><text x="72" y="281" font-size="30" fill="#315CCB" font-weight="700">Найдено в коде</text><text x="72" y="339" font-size="32" fill="#17263D" font-weight="400">В feature-builder объявлено потребление PriceChanged v2.</text><text x="72" y="389" font-size="24" fill="#566983" font-weight="400">bus.subscribe(&quot;pricechanged-v2&quot;, &quot;price-consumers&quot;, &quot;PriceChanged&quot;, 2, receive)</text><text x="72" y="494" font-size="30" fill="#087F86" font-weight="700">Для найденного использования v2</text><text x="72" y="550" font-size="34" fill="#17263D" font-weight="600">Изменения не требуются.</text><text x="72" y="663" font-size="30" fill="#9B5B06" font-weight="700">Готовность отключить v1 не подтверждена</text><text x="72" y="718" font-size="30" fill="#17263D" font-weight="400">Полнота охвата потребителей и состояние рабочего окружения</text><text x="72" y="761" font-size="30" fill="#17263D" font-weight="400">не проверены.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Доказательство</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">11 / 22</text></g></svg>