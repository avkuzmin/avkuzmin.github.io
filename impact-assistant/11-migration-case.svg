<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Что означает полученный отчёт</title><desc id="desc">Разбор результата демонстрации PriceChanged v1 / v2</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">IMPACT ASSISTANT  /  ДИПЛОМНЫЙ ПРОЕКТ</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Что означает полученный отчёт</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Разбор результата демонстрации PriceChanged v1 / v2</text><text x="72" y="290" font-size="30" fill="#315CCB" font-weight="700">Нашли</text><text x="72" y="346" font-size="32" fill="#17263D" font-weight="400">feature-builder подписан на PriceChanged v2.</text><text x="72" y="391" font-size="32" fill="#17263D" font-weight="400">Основание — регистрация подписки в исходнике.</text><text x="72" y="492" font-size="30" fill="#087F86" font-weight="700">Вывод</text><text x="72" y="549" font-size="34" fill="#17263D" font-weight="600">Найденной подписке перенос с v1 не требуется.</text><text x="72" y="666" font-size="30" fill="#9B5B06" font-weight="700">Остаётся проверить</text><text x="72" y="722" font-size="30" fill="#17263D" font-weight="400">Есть ли другие потребители v1 и используется ли она</text><text x="72" y="765" font-size="30" fill="#17263D" font-weight="400">в рабочем окружении. Отчёт ограничен доступными источниками.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Ключевой слайд</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">11 / 19</text></g></svg>