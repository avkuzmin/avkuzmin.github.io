<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Правила и LLM: сильные стороны и ограничения</title><desc id="desc">Оба подхода анализируют свидетельства, но дают разные гарантии</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">ВСПОМОГАТЕЛЬНЫЕ СЛАЙДЫ  /  IMPACT ASSISTANT</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Правила и LLM: сильные стороны и ограничения</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Оба подхода анализируют свидетельства, но дают разные гарантии</text><text x="72" y="280" font-size="25" fill="#315CCB" font-weight="700">Возможность</text><text x="770" y="280" font-size="28" fill="#315CCB" font-weight="700">Правила</text><text x="1170" y="280" font-size="28" fill="#315CCB" font-weight="700">LLM</text><path d="M72 302h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="354" font-size="29" fill="#17263D" font-weight="400">Зависимости и источники</text><text x="770" y="349" font-size="37" fill="#087F86" font-weight="700">+</text><text x="770" y="382" font-size="23" fill="#17263D" font-weight="400">по графу и правилам</text><text x="1170" y="349" font-size="37" fill="#087F86" font-weight="700">+</text><text x="1170" y="382" font-size="23" fill="#17263D" font-weight="400">по переданному контексту</text><path d="M72 406h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="458" font-size="29" fill="#17263D" font-weight="400">Механизм и условия отказа</text><text x="770" y="453" font-size="37" fill="#087F86" font-weight="700">+</text><text x="770" y="486" font-size="23" fill="#17263D" font-weight="400">в пределах правил</text><text x="1170" y="453" font-size="37" fill="#9B5B06" font-weight="700">±</text><text x="1170" y="486" font-size="23" fill="#17263D" font-weight="400">вывод нужно проверить</text><path d="M72 510h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="562" font-size="29" fill="#17263D" font-weight="400">Случай вне заданных правил</text><text x="770" y="557" font-size="37" fill="#AB3E44" font-weight="700">−</text><text x="770" y="590" font-size="23" fill="#17263D" font-weight="400">фиксируют пробел</text><text x="1170" y="557" font-size="37" fill="#9B5B06" font-weight="700">±</text><text x="1170" y="590" font-size="23" fill="#17263D" font-weight="400">гипотеза по исходникам</text><path d="M72 614h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="666" font-size="29" fill="#17263D" font-weight="400">Повторяемость вывода</text><text x="770" y="661" font-size="37" fill="#087F86" font-weight="700">+</text><text x="770" y="694" font-size="23" fill="#17263D" font-weight="400">при фиксированном входе</text><text x="1170" y="661" font-size="37" fill="#AB3E44" font-weight="700">−</text><text x="1170" y="694" font-size="23" fill="#17263D" font-weight="400">не гарантирована</text><path d="M72 718h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="772" font-size="23" fill="#566983" font-weight="400">+ предусмотрено    − не выполняется или не гарантируется    ± зависит от случая</text><text x="72" y="804" font-size="23" fill="#566983" font-weight="400">Оценка по правилам и модельное заключение сохраняются отдельно.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">22 / 25</text></g></svg>