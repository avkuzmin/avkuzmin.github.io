<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Задача и границы решения</title><desc id="desc">Для архитекторов, системных аналитиков и команд приложений</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">IMPACT ASSISTANT  /  ДИПЛОМНЫЙ ПРОЕКТ</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Задача и границы решения</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Для архитекторов, системных аналитиков и команд приложений</text><text x="72" y="300" font-size="22" fill="#315CCB" font-weight="700">Проблема</text><text x="762" y="300" font-size="22" fill="#315CCB" font-weight="700">Что даёт ассистент</text><path d="M72 322h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="367" font-size="30" fill="#17263D" font-weight="400">Трудно найти все приложения,</text><text x="72" y="410" font-size="30" fill="#17263D" font-weight="400">которые затронет изменение</text><text x="762" y="367" font-size="30" fill="#17263D" font-weight="400">Зависимости из кода,</text><text x="762" y="410" font-size="30" fill="#17263D" font-weight="400">спецификаций и конфигураций</text><path d="M72 482h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="527" font-size="30" fill="#17263D" font-weight="400">Трудно проверить основания</text><text x="72" y="570" font-size="30" fill="#17263D" font-weight="400">и восстановить прежний вывод</text><text x="762" y="527" font-size="30" fill="#17263D" font-weight="400">Сохранённый отчёт с источниками,</text><text x="762" y="570" font-size="30" fill="#17263D" font-weight="400">версией знаний и пробелами</text><path d="M72 642h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="750" font-size="23" fill="#566983" font-weight="400">POC: синтетические источники и локальные модели.</text><text x="72" y="782" font-size="23" fill="#566983" font-weight="400">MVP: корпоративные данные, доступ и эксплуатация.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Ключевой слайд</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">02 / 21</text></g></svg>