<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Долгий анализ и риск пропустить зависимую систему</title><desc id="desc">Проблема архитекторов и системных аналитиков</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">IMPACT ASSISTANT  /  ДИПЛОМНЫЙ ПРОЕКТ</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Долгий анализ и риск пропустить зависимую систему</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Проблема архитекторов и системных аналитиков</text><text x="72" y="310" font-size="30" fill="#315CCB" font-weight="700">Почему это сложно</text><text x="72" y="371" font-size="32" fill="#17263D" font-weight="400">Сведения разбросаны по документации, коду и настройкам.</text><text x="72" y="419" font-size="32" fill="#17263D" font-weight="400">Архитектор собирает зависимости и уточняет их у команд.</text><text x="72" y="595" font-size="30" fill="#087F86" font-weight="700">Чем поможет ассистент</text><text x="72" y="656" font-size="32" fill="#17263D" font-weight="400">Найдёт затронутые системы и связи между ними,</text><text x="72" y="704" font-size="32" fill="#17263D" font-weight="400">покажет источники и отметит недостающие сведения.</text><text x="72" y="799" font-size="23" fill="#566983" font-weight="400">Ожидаемый эффект: меньше ручного поиска и пропущенных зависимостей.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Ключевой слайд</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">02 / 21</text></g></svg>