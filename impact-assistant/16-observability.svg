<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Телеметрия и диагностика MVP</title><desc id="desc">Платформенный мониторинг не участвует в расчёте предметного вывода</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">ВСПОМОГАТЕЛЬНЫЕ СЛАЙДЫ  /  IMPACT ASSISTANT</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Телеметрия и диагностика MVP</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Платформенный мониторинг не участвует в расчёте предметного вывода</text><rect x="72" y="300" width="405" height="150" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="96" y="328" font-size="17" fill="#315CCB" font-weight="700">ПУБЛИКУЕТ</text><text x="96" y="367" font-size="27" fill="#17263D" font-weight="700">Приложение</text><text x="96" y="399" font-size="22" fill="#566983" font-weight="400">Метрики этапов и состояний</text><text x="96" y="426" font-size="22" fill="#566983" font-weight="400">Проверки live / ready</text><rect x="588" y="300" width="405" height="150" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="612" y="328" font-size="17" fill="#315CCB" font-weight="700">НАБЛЮДАЕТ</text><text x="612" y="367" font-size="27" fill="#17263D" font-weight="700">Prometheus</text><text x="612" y="399" font-size="22" fill="#566983" font-weight="400">Собирает метрики</text><text x="612" y="426" font-size="22" fill="#566983" font-weight="400">Оценивает правила</text><rect x="1104" y="300" width="424" height="150" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="1128" y="328" font-size="17" fill="#315CCB" font-weight="700">ВИЗУАЛИЗИРУЕТ</text><text x="1128" y="367" font-size="27" fill="#17263D" font-weight="700">Grafana</text><text x="1128" y="399" font-size="22" fill="#566983" font-weight="400">Показывает состояние</text><text x="1128" y="426" font-size="22" fill="#566983" font-weight="400">Помогает разбирать инцидент</text><path d="M477 375H588" fill="none" stroke="#315CCB" stroke-width="3" marker-end="url(#arrow)"/><text x="482" y="354" font-size="21" fill="#315CCB" font-weight="600">метрики</text><path d="M993 375H1104" fill="none" stroke="#315CCB" stroke-width="3" marker-end="url(#arrow)"/><text x="1006" y="354" font-size="21" fill="#315CCB" font-weight="600">данные</text><text x="72" y="587" font-size="29" fill="#17263D" font-weight="400">Журналы собирает корпоративный контур.</text><text x="72" y="640" font-size="29" fill="#17263D" font-weight="400">Оператор сопоставляет этап, ID операции и версии компонентов.</text><text x="72" y="693" font-size="29" fill="#17263D" font-weight="400">Приёмник трасс и маршрут оповещений подтверждаются для MVP.</text><text x="72" y="816" font-size="23" fill="#566983" font-weight="400">Стрелки показывают поток данных. Prometheus собирает метрики; Grafana читает их из источника.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">16 / 24</text></g></svg>