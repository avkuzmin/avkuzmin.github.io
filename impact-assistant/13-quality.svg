<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Как проверяем результат</title><desc id="desc">Конкретная ситуация и поведение, которое должно получиться</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">IMPACT ASSISTANT  /  ДИПЛОМНЫЙ ПРОЕКТ</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Как проверяем результат</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Конкретная ситуация и поведение, которое должно получиться</text><text x="72" y="258" font-size="22" fill="#315CCB" font-weight="700">Проверочная ситуация</text><text x="677" y="258" font-size="22" fill="#315CCB" font-weight="700">Ожидаемый результат</text><path d="M72 280h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="325" font-size="26" fill="#17263D" font-weight="400">Найдена подписка приложения</text><text x="72" y="360" font-size="26" fill="#17263D" font-weight="400">на отключаемую версию v1</text><text x="677" y="325" font-size="26" fill="#17263D" font-weight="400">Названы приложение, версия и исходник.</text><text x="677" y="360" font-size="26" fill="#17263D" font-weight="400">Перенос на v2 не считается завершённым.</text><path d="M72 378h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="423" font-size="26" fill="#17263D" font-weight="400">Нет подтверждённой связи</text><text x="72" y="458" font-size="26" fill="#17263D" font-weight="400">с приложением</text><text x="677" y="423" font-size="26" fill="#17263D" font-weight="400">Показаны кандидат и недостающая связь.</text><text x="677" y="458" font-size="26" fill="#17263D" font-weight="400">Отказ приложения не объявлен доказанным.</text><path d="M72 476h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="521" font-size="26" fill="#17263D" font-weight="400">Генеративная модель</text><text x="72" y="556" font-size="26" fill="#17263D" font-weight="400">недоступна</text><text x="677" y="521" font-size="26" fill="#17263D" font-weight="400">Результат правил сохранён.</text><text x="677" y="556" font-size="26" fill="#17263D" font-weight="400">Отсутствие модельного вывода обозначено явно.</text><path d="M72 574h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="619" font-size="26" fill="#17263D" font-weight="400">Отчёт открывают</text><text x="72" y="654" font-size="26" fill="#17263D" font-weight="400">повторно</text><text x="677" y="619" font-size="26" fill="#17263D" font-weight="400">Возвращён тот же сохранённый результат.</text><text x="677" y="654" font-size="26" fill="#17263D" font-weight="400">Нового вызова модели нет.</text><path d="M72 672h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="717" font-size="26" fill="#17263D" font-weight="400">Модель описывает</text><text x="72" y="752" font-size="26" fill="#17263D" font-weight="400">последствие изменения</text><text x="677" y="717" font-size="26" fill="#17263D" font-weight="400">Утверждение, механизм и условия</text><text x="677" y="752" font-size="26" fill="#17263D" font-weight="400">согласуются с указанным исходником.</text><path d="M72 770h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="817" font-size="23" fill="#566983" font-weight="400">Отмена, отзыв доступа и конфликт повторного запроса проверяются отдельно на уровне API.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">13 / 21</text></g></svg>