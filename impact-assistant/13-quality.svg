<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Проверка качества отчёта</title><desc id="desc">Критерии проверки результата анализа</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">ВСПОМОГАТЕЛЬНЫЕ СЛАЙДЫ  /  IMPACT ASSISTANT</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Проверка качества отчёта</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Критерии проверки результата анализа</text><text x="72" y="290" font-size="22" fill="#315CCB" font-weight="700">Что проверяем</text><text x="682" y="290" font-size="22" fill="#315CCB" font-weight="700">Критерий</text><path d="M72 312h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="357" font-size="29" fill="#17263D" font-weight="400">Зависимость и версия</text><text x="682" y="357" font-size="29" fill="#17263D" font-weight="400">Названы приложение и версия,</text><text x="682" y="398" font-size="29" fill="#17263D" font-weight="400">есть ссылка на исходник</text><path d="M72 452h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="497" font-size="29" fill="#17263D" font-weight="400">Объяснение последствия</text><text x="682" y="497" font-size="29" fill="#17263D" font-weight="400">Утверждение и условия следуют</text><text x="682" y="538" font-size="29" fill="#17263D" font-weight="400">из приведённых свидетельств</text><path d="M72 592h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="637" font-size="29" fill="#17263D" font-weight="400">Неполные данные или сбой LLM</text><text x="682" y="637" font-size="29" fill="#17263D" font-weight="400">Пробел или отказ обозначен явно.</text><text x="682" y="678" font-size="29" fill="#17263D" font-weight="400">Доступный результат правил сохранён</text><path d="M72 732h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="797" font-size="23" fill="#566983" font-weight="400">POC: четыре синтетических случая. Общая точность на реальных изменениях пока не измерена.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">13 / 21</text></g></svg>