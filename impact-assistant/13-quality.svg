<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Результаты сравнения: четыре облачных отчёта</title><desc id="desc">gpt-oss-20b · 14.09.2026 · ручная сверка с исходниками</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">ВСПОМОГАТЕЛЬНЫЕ СЛАЙДЫ  /  IMPACT ASSISTANT</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Результаты сравнения: четыре облачных отчёта</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">gpt-oss-20b · 14.09.2026 · ручная сверка с исходниками</text><text x="72" y="265" font-size="22" fill="#315CCB" font-weight="700">Случай</text><text x="442" y="265" font-size="22" fill="#315CCB" font-weight="700">Правила</text><text x="917" y="265" font-size="22" fill="#315CCB" font-weight="700">Модель / ручная оценка</text><path d="M72 287h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="325" font-size="26" fill="#17263D" font-weight="400">Есть v1</text><text x="442" y="325" font-size="26" fill="#17263D" font-weight="400">Нужно перевести подписчика</text><text x="917" y="325" font-size="26" fill="#17263D" font-weight="400">Условное следствие верно;</text><text x="917" y="359" font-size="26" fill="#17263D" font-weight="400">почти повторяет правило</text><path d="M72 395h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="433" font-size="26" fill="#17263D" font-weight="400">Найдена только v2</text><text x="442" y="433" font-size="26" fill="#17263D" font-weight="400">Для найденной связи</text><text x="442" y="467" font-size="26" fill="#17263D" font-weight="400">миграция не нужна</text><text x="917" y="433" font-size="26" fill="#17263D" font-weight="400">Черновик преувеличивает</text><text x="917" y="467" font-size="26" fill="#17263D" font-weight="400">полноту списка приложений</text><path d="M72 503h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="541" font-size="26" fill="#17263D" font-weight="400">v1, v2 и неясная версия</text><text x="442" y="541" font-size="26" fill="#17263D" font-weight="400">Разделены по основаниям</text><text x="917" y="541" font-size="26" fill="#17263D" font-weight="400">Ошибка: требует миграцию</text><text x="917" y="575" font-size="26" fill="#17263D" font-weight="400">уже перешедшего приложения</text><path d="M72 611h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="649" font-size="26" fill="#17263D" font-weight="400">Потребители не найдены</text><text x="442" y="649" font-size="26" fill="#17263D" font-weight="400">Запрашивает сведения</text><text x="917" y="649" font-size="26" fill="#17263D" font-weight="400">Ответ отклонён;</text><text x="917" y="683" font-size="26" fill="#17263D" font-weight="400">формальная часть сохранена</text><path d="M72 719h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="787" font-size="23" fill="#566983" font-weight="400">Дополнительная польза LLM сверх правил в этой серии не подтверждена.</text><text x="72" y="819" font-size="23" fill="#566983" font-weight="400">Проверка ссылок и повторная оценка той же моделью не исключают смысловые ошибки.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">13 / 26</text></g></svg>