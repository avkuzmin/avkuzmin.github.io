<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Доказательство: новый отчёт через UI</title><desc id="desc">Запись настоящего запуска: вопрос → уточнение → подтверждение → результат</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">IMPACT ASSISTANT  /  ДИПЛОМНЫЙ ПРОЕКТ</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Доказательство: новый отчёт через UI</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Запись настоящего запуска: вопрос → уточнение → подтверждение → результат</text><text x="72" y="340" font-size="48" fill="#17263D" font-weight="700">«Можно ли отключать v1 события</text><text x="72" y="408" font-size="48" fill="#17263D" font-weight="700">об изменении цены товара?»</text><text x="72" y="575" font-size="30" fill="#315CCB" font-weight="700">Видео · 60 секунд</text><text x="72" y="637" font-size="34" fill="#17263D" font-weight="400">Запись 14.09.2026: новый анализ PriceChanged через UI.</text><text x="72" y="687" font-size="34" fill="#17263D" font-weight="400">Ожидание ускорено; фактический результат показан без подмены.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Доказательство</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">10 / 24</text></g></svg>