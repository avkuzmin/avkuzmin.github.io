<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Методика оценки ресурсов и стоимости MVP</title><desc id="desc">Расчёт от нагрузки и замеров; характеристики ноутбука не переносятся на GPUStack</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">IMPACT ASSISTANT  /  ДИПЛОМНЫЙ ПРОЕКТ</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Методика оценки ресурсов и стоимости MVP</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Расчёт от нагрузки и замеров; характеристики ноутбука не переносятся на GPUStack</text><text x="72" y="265" font-size="22" fill="#315CCB" font-weight="700">Входные данные</text><text x="767" y="265" font-size="22" fill="#315CCB" font-weight="700">Что рассчитываем</text><path d="M72 287h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="332" font-size="26" fill="#17263D" font-weight="400">Поток запросов, длительность</text><text x="72" y="367" font-size="26" fill="#17263D" font-weight="400">анализа и допустимый p95</text><text x="767" y="332" font-size="26" fill="#17263D" font-weight="400">Параллельность исполнителей,</text><text x="767" y="367" font-size="26" fill="#17263D" font-weight="400">очередь, CPU и память приложения</text><path d="M72 414h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="459" font-size="26" fill="#17263D" font-weight="400">Токены, длина контекста</text><text x="72" y="494" font-size="26" fill="#17263D" font-weight="400">и объём переиндексации</text><text x="767" y="459" font-size="26" fill="#17263D" font-weight="400">Квоты GPUStack на генерацию и эмбеддинги;</text><text x="767" y="494" font-size="26" fill="#17263D" font-weight="400">резерв для интерактивных запросов</text><path d="M72 541h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="586" font-size="26" fill="#17263D" font-weight="400">Размер графа, фрагментов</text><text x="72" y="621" font-size="26" fill="#17263D" font-weight="400">и число сохраняемых версий</text><text x="767" y="586" font-size="26" fill="#17263D" font-weight="400">Хранилища, резервные копии,</text><text x="767" y="621" font-size="26" fill="#17263D" font-weight="400">стоимость восстановления и эксплуатации</text><path d="M72 668h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="782" font-size="23" fill="#566983" font-weight="400">TCO = ресурсы приложения + доля общих платформ + хранение и копии + эксплуатация.</text><text x="72" y="814" font-size="23" fill="#566983" font-weight="400">Итоговая сумма и подтверждённые целевые ресурсы пока отсутствуют.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">16 / 18</text></g></svg>