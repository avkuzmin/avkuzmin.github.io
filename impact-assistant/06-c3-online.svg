" y="619" font-size="15" fill="#315CCB" font-weight="700">ГРУППА КОМПОНЕНТОВ</text><text x="118" y="648" font-size="24" fill="#17263D" font-weight="700">Анализ и отчёт</text><text x="118" y="675" font-size="19" fill="#566983" font-weight="400">Правила и модельные выводы</text><rect x="725" y="275" width="375" height="108" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="743" y="299" font-size="15" fill="#315CCB" font-weight="700">ГРУППА АДАПТЕРОВ</text><text x="743" y="328" font-size="24" fill="#17263D" font-weight="700">Репозитории данных</text><text x="743" y="355" font-size="19" fill="#566983" font-weight="400">Знания, задания, артефакты</text><rect x="725" y="435" width="375" height="108" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="743" y="459" font-size="15" fill="#315CCB" font-weight="700">COMPONENT</text><text x="743" y="488" font-size="24" fill="#17263D" font-weight="700">Модельный адаптер</text><text x="743" y="515" font-size="19" fill="#566983" font-weight="400">Намерение, эмбеддинги, анализ</text><rect x="725" y="655" width="375" height="108" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="743" y="679" font-size="15" fill="#315CCB" font-weight="700">COMPONENT</text><text x="743" y="708" font-size="24" fill="#17263D" font-weight="700">Адаптер секретов</text><text x="743" y="735" font-size="19" fill="#566983" font-weight="400">Получение и обновление</text><rect x="1270" y="263" width="258" height="94" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="1288" y="287" font-size="15" fill="#315CCB" font-weight="700">EXTERNAL SYSTEM</text><text x="1288" y="316" font-size="24" fill="#17263D" font-weight="700">IAM / Keycloak</text><text x="1288" y="343" font-size="19" fill="#566983" font-weight="400">Интроспекция</text><rect x="1270" y="393" width="258" height="118" rx="0" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="1285" y="418" font-size="15" fill="#315CCB" font-weight="70