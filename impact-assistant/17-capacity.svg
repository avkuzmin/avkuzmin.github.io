<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Время и стоимость облачного POC</title><desc id="desc">Четыре сценария · 14.09.2026 · стоимость по записанным токенам</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">ВСПОМОГАТЕЛЬНЫЕ СЛАЙДЫ  /  IMPACT ASSISTANT</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Время и стоимость облачного POC</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Четыре сценария · 14.09.2026 · стоимость по записанным токенам</text><text x="72" y="265" font-size="22" fill="#315CCB" font-weight="700">Показатель</text><text x="582" y="265" font-size="22" fill="#315CCB" font-weight="700">Измерение</text><text x="1057" y="265" font-size="22" fill="#315CCB" font-weight="700">Границы</text><path d="M72 287h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="325" font-size="26" fill="#17263D" font-weight="400">Сохранение отчёта</text><text x="582" y="325" font-size="26" fill="#17263D" font-weight="400">12,88–15,65 с</text><text x="1057" y="325" font-size="26" fill="#17263D" font-weight="400">После принятия анализа;</text><text x="1057" y="359" font-size="26" fill="#17263D" font-weight="400">без уточнений пользователя</text><path d="M72 399h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="437" font-size="26" fill="#17263D" font-weight="400">Генерация четырёх случаев</text><text x="582" y="437" font-size="26" fill="#17263D" font-weight="400">33 646 токенов / ≈ 3,36 ₽</text><text x="1057" y="437" font-size="26" fill="#17263D" font-weight="400">Намерение, аналитика</text><text x="1057" y="471" font-size="26" fill="#17263D" font-weight="400">и повторная проверка</text><path d="M72 511h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="549" font-size="26" fill="#17263D" font-weight="400">Чистая индексация</text><text x="582" y="549" font-size="26" fill="#17263D" font-weight="400">188 векторов × 256</text><text x="1057" y="549" font-size="26" fill="#17263D" font-weight="400">190 записанных вызовов</text><text x="1057" y="583" font-size="26" fill="#17263D" font-weight="400">включая два контроля</text><path d="M72 623h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="661" font-size="26" fill="#17263D" font-weight="400">Эмбеддинги индекса</text><text x="582" y="661" font-size="26" fill="#17263D" font-weight="400">17 528 токенов / ≈ 0,18 ₽</text><text x="1057" y="661" font-size="26" fill="#17263D" font-weight="400">Без проб привязки</text><text x="1057" y="695" font-size="26" fill="#17263D" font-weight="400">и поисковых запросов</text><path d="M72 735h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="785" font-size="23" fill="#566983" font-weight="400">Расчёт по публичному тарифу с НДС; это не полный счёт за этап.</text><text x="72" y="817" font-size="23" fill="#566983" font-weight="400">Малая серия не определяет SLA, p95 и экономию рабочего времени.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">17 / 22</text></g></svg>