<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Ресурсы и замеры локального POC</title><desc id="desc">Конфигурация стенда и успешные модельные вызовы серии 11.09.2026</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">ВСПОМОГАТЕЛЬНЫЕ СЛАЙДЫ  /  IMPACT ASSISTANT</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Ресурсы и замеры локального POC</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Конфигурация стенда и успешные модельные вызовы серии 11.09.2026</text><text x="72" y="265" font-size="22" fill="#315CCB" font-weight="700">Показатель</text><text x="647" y="265" font-size="22" fill="#315CCB" font-weight="700">Значение</text><text x="1037" y="265" font-size="22" fill="#315CCB" font-weight="700">Что означает</text><path d="M72 287h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="323" font-size="25" fill="#17263D" font-weight="400">Память компьютера</text><text x="647" y="323" font-size="25" fill="#17263D" font-weight="400">48 ГиБ</text><text x="1037" y="323" font-size="25" fill="#17263D" font-weight="400">Установлено, не потребление POC</text><path d="M72 374h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="410" font-size="25" fill="#17263D" font-weight="400">Размер файла LLM</text><text x="647" y="410" font-size="25" fill="#17263D" font-weight="400">18,97 ГБ</text><text x="1037" y="410" font-size="25" fill="#17263D" font-weight="400">GGUF на диске, не объём RAM</text><path d="M72 461h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="497" font-size="25" fill="#17263D" font-weight="400">Контекст / параллельность</text><text x="647" y="497" font-size="25" fill="#17263D" font-weight="400">8192 токена / 1 слот</text><text x="1037" y="497" font-size="25" fill="#17263D" font-weight="400">Настройки llama.cpp</text><path d="M72 548h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="584" font-size="25" fill="#17263D" font-weight="400">Разбор намерения</text><text x="647" y="584" font-size="25" fill="#17263D" font-weight="400">10,1–12,1 с</text><text x="1037" y="584" font-size="25" fill="#17263D" font-weight="400">4 успешных вызова модели</text><path d="M72 635h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="671" font-size="25" fill="#17263D" font-weight="400">Генерация и проверка</text><text x="647" y="671" font-size="25" fill="#17263D" font-weight="400">45,6–77,6 с</text><text x="1037" y="671" font-size="25" fill="#17263D" font-weight="400">7 отдельных успешных вызовов</text><path d="M72 722h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="780" font-size="23" fill="#566983" font-weight="400">Диапазоны относятся к отдельным вызовам модели. Полный анализ включает несколько этапов.</text><text x="72" y="812" font-size="23" fill="#566983" font-weight="400">Ресурсы корпоративного MVP требуют отдельного расчёта по нагрузке.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">17 / 19</text></g></svg>