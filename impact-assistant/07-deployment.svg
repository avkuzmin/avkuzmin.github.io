<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Развёртывание MVP</title><desc id="desc">Целевые области размещения; число экземпляров определяется после измерений</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">IMPACT ASSISTANT  /  ДИПЛОМНЫЙ ПРОЕКТ</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Развёртывание MVP</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Целевые области размещения; число экземпляров определяется после измерений</text><rect x="72" y="240" width="915" height="555" rx="16" fill="#EDF2FB" stroke="#D6E0ED" stroke-width="2"/><text x="98" y="280" font-size="19" fill="#315CCB" font-weight="700">DECKHOUSE / KUBERNETES · КОНТУР ПРИЛОЖЕНИЯ</text><rect x="105" y="325" width="393" height="145" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="129" y="353" font-size="17" fill="#315CCB" font-weight="700">APPLICATION INSTANCE</text><text x="129" y="392" font-size="27" fill="#17263D" font-weight="700">API и анализ</text><text x="129" y="424" font-size="22" fill="#566983" font-weight="400">Совместное размещение</text><rect x="550" y="325" width="397" height="145" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="574" y="353" font-size="17" fill="#315CCB" font-weight="700">APPLICATION INSTANCE</text><text x="574" y="392" font-size="27" fill="#17263D" font-weight="700">Синхронизация</text><text x="574" y="424" font-size="22" fill="#566983" font-weight="400">Отдельные права и ресурсы</text><rect x="105" y="590" width="255" height="127" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="129" y="618" font-size="17" fill="#315CCB" font-weight="700">STATEFUL INSTANCE</text><text x="129" y="657" font-size="27" fill="#17263D" font-weight="700">PostgreSQL</text><rect x="399" y="590" width="255" height="127" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="423" y="618" font-size="17" fill="#315CCB" font-weight="700">STATEFUL INSTANCE</text><text x="423" y="657" font-size="27" fill="#17263D" font-weight="700">Neo4j</text><rect x="693" y="590" width="255" height="127" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="717" y="618" font-size="17" fill="#315CCB" font-weight="700">ПРОФИЛЬ НЕ ВЫБРАН</text><text x="717" y="657" font-size="27" fill="#17263D" font-weight="700">Индекс</text><rect x="1130" y="300" width="398" height="150" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="1154" y="328" font-size="17" fill="#315CCB" font-weight="700">КОРПОРАТИВНАЯ ПЛАТФОРМА</text><text x="1154" y="367" font-size="27" fill="#17263D" font-weight="700">Общий S3</text><text x="1154" y="399" font-size="22" fill="#566983" font-weight="400">Раздельные области источников</text><text x="1154" y="426" font-size="22" fill="#566983" font-weight="400">и артефактов приложения</text><rect x="1130" y="578" width="398" height="150" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="1154" y="606" font-size="17" fill="#315CCB" font-weight="700">КОРПОРАТИВНАЯ ПЛАТФОРМА</text><text x="1154" y="645" font-size="27" fill="#17263D" font-weight="700">GPUStack</text><text x="1154" y="677" font-size="22" fill="#566983" font-weight="400">API и анализ: LLM и поиск</text><text x="1154" y="704" font-size="22" fill="#566983" font-weight="400">Синхронизация: эмбеддинги</text><text x="107" y="522" font-size="23" fill="#566983" font-weight="400">Хранилища принадлежат приложению; данные требуют резервирования.</text><text x="72" y="826" font-size="23" fill="#566983" font-weight="400">Расположение на узлах, HA и квоты не утверждены. IAM и сбор телеметрии показаны отдельно.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Ключевой слайд</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">07 / 18</text></g></svg>