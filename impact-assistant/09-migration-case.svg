<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Пример: отключение PriceChanged v1</title><desc id="desc">Задача перед демонстрацией: проверить переход потребителей на v2</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">IMPACT ASSISTANT  /  ДИПЛОМНЫЙ ПРОЕКТ</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Пример: отключение PriceChanged v1</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Задача перед демонстрацией: проверить переход потребителей на v2</text><text x="72" y="292" font-size="22" fill="#315CCB" font-weight="700">Вопрос аналитика</text><text x="632" y="292" font-size="22" fill="#315CCB" font-weight="700">Что найдено в сохранённом примере</text><path d="M72 314h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="359" font-size="28" fill="#17263D" font-weight="400">Кто использует событие?</text><text x="632" y="359" font-size="28" fill="#17263D" font-weight="400">feature-builder подписан на PriceChanged v2</text><path d="M72 451h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="496" font-size="28" fill="#17263D" font-weight="400">Нужен ли ему перенос с v1?</text><text x="632" y="496" font-size="28" fill="#17263D" font-weight="400">Для найденной подписки перенос не требуется</text><path d="M72 588h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="633" font-size="28" fill="#17263D" font-weight="400">Можно ли отключить v1?</text><text x="632" y="633" font-size="28" fill="#17263D" font-weight="400">Нужно подтвердить полноту списка потребителей</text><text x="632" y="673" font-size="28" fill="#17263D" font-weight="400">и отсутствие рабочего трафика v1</text><path d="M72 725h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="790" font-size="23" fill="#566983" font-weight="400">Основание: регистрация pricechanged-v2 в исходнике. Это не измерение рабочего трафика.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Ключевой слайд</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">09 / 18</text></g></svg>