<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Правила и LLM: роли в анализе</title><desc id="desc">Оба подхода оценивают изменение по доступным свидетельствам</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">IMPACT ASSISTANT  /  ДИПЛОМНЫЙ ПРОЕКТ</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Правила и LLM: роли в анализе</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Оба подхода оценивают изменение по доступным свидетельствам</text><text x="72" y="290" font-size="22" fill="#315CCB" font-weight="700"></text><text x="467" y="290" font-size="22" fill="#315CCB" font-weight="700">Правила</text><text x="1012" y="290" font-size="22" fill="#315CCB" font-weight="700">LLM</text><path d="M72 312h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="357" font-size="27" fill="#17263D" font-weight="400">Получение вывода</text><text x="467" y="357" font-size="27" fill="#17263D" font-weight="400">Граф и заданные проверки</text><text x="1012" y="357" font-size="27" fill="#17263D" font-weight="400">Интерпретация исходников</text><path d="M72 442h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="487" font-size="27" fill="#17263D" font-weight="400">За пределами правил</text><text x="467" y="487" font-size="27" fill="#17263D" font-weight="400">Фиксируют пробел</text><text x="1012" y="487" font-size="27" fill="#17263D" font-weight="400">Может предложить гипотезу</text><path d="M72 572h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="617" font-size="27" fill="#17263D" font-weight="400">Проверка результата</text><text x="467" y="617" font-size="27" fill="#17263D" font-weight="400">Повторяемость при том же входе.</text><text x="467" y="655" font-size="27" fill="#17263D" font-weight="400">проверка правил и источников</text><text x="1012" y="617" font-size="27" fill="#17263D" font-weight="400">Сопоставление утверждений</text><text x="1012" y="655" font-size="27" fill="#17263D" font-weight="400">с исходниками</text><path d="M72 702h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="790" font-size="23" fill="#566983" font-weight="400">Оценка по правилам и модельное заключение сохраняются отдельно.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Ключевой слайд</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">03 / 21</text></g></svg>