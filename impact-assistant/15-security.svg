<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Безопасность: уязвимости и управление</title><desc id="desc">Реализованные ограничения локального POC · OWASP LLM Top 10 (2025)</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">ВСПОМОГАТЕЛЬНЫЕ СЛАЙДЫ  /  IMPACT ASSISTANT</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Безопасность: уязвимости и управление</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Реализованные ограничения локального POC · OWASP LLM Top 10 (2025)</text><text x="72" y="246" font-size="22" fill="#315CCB" font-weight="700">Уязвимость / сценарий риска</text><text x="572" y="246" font-size="22" fill="#315CCB" font-weight="700">Что реализовано</text><text x="1312" y="246" font-size="22" fill="#315CCB" font-weight="700">OWASP</text><path d="M72 268h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="303" font-size="24" fill="#17263D" font-weight="400">Вредоносные инструкции</text><text x="72" y="334" font-size="24" fill="#17263D" font-weight="400">в документах и исходниках</text><text x="572" y="303" font-size="24" fill="#17263D" font-weight="400">Промпт отделён от JSON с исходниками.</text><text x="572" y="334" font-size="24" fill="#17263D" font-weight="400">Модели указано: источники — данные.</text><text x="1312" y="303" font-size="24" fill="#17263D" font-weight="400">LLM01</text><path d="M72 353h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="388" font-size="24" fill="#17263D" font-weight="400">Утечка закрытых данных</text><text x="72" y="419" font-size="24" fill="#17263D" font-weight="400">через поиск или отчёт</text><text x="572" y="388" font-size="24" fill="#17263D" font-weight="400">Keycloak подтверждает пользователя.</text><text x="572" y="419" font-size="24" fill="#17263D" font-weight="400">API проверяет владельца и области.</text><text x="1312" y="388" font-size="24" fill="#17263D" font-weight="400">LLM02, 08</text><path d="M72 438h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="473" font-size="24" fill="#17263D" font-weight="400">Подмена исходников</text><text x="72" y="504" font-size="24" fill="#17263D" font-weight="400">или содержимого индекса</text><text x="572" y="473" font-size="24" fill="#17263D" font-weight="400">Целостность артефактов проверяется кодом.</text><text x="572" y="504" font-size="24" fill="#17263D" font-weight="400">Граф читается с привязкой к версии.</text><text x="1312" y="473" font-size="24" fill="#17263D" font-weight="400">LLM04, 08</text><path d="M72 523h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="558" font-size="24" fill="#17263D" font-weight="400">Опасный или необоснованный</text><text x="72" y="589" font-size="24" fill="#17263D" font-weight="400">ответ модели</text><text x="572" y="558" font-size="24" fill="#17263D" font-weight="400">UI выводит текст; ссылки проверяет код.</text><text x="572" y="589" font-size="24" fill="#17263D" font-weight="400">Содержание повторно оценивает та же LLM.</text><text x="1312" y="558" font-size="24" fill="#17263D" font-weight="400">LLM05, 09</text><path d="M72 608h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="643" font-size="24" fill="#17263D" font-weight="400">Действия без разрешения</text><text x="72" y="674" font-size="24" fill="#17263D" font-weight="400">пользователя</text><text x="572" y="643" font-size="24" fill="#17263D" font-weight="400">Модели не передаются инструменты действий.</text><text x="572" y="674" font-size="24" fill="#17263D" font-weight="400">Сервер перепроверяет параметры анализа.</text><text x="1312" y="643" font-size="24" fill="#17263D" font-weight="400">LLM06</text><path d="M72 693h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="728" font-size="24" fill="#17263D" font-weight="400">Перегрузка ресурсов</text><text x="72" y="759" font-size="24" fill="#17263D" font-weight="400">долгими запросами</text><text x="572" y="728" font-size="24" fill="#17263D" font-weight="400">Есть лимиты ответа, времени и очереди.</text><text x="572" y="759" font-size="24" fill="#17263D" font-weight="400">Темп индексации ограничен.</text><text x="1312" y="728" font-size="24" fill="#17263D" font-weight="400">LLM10</text><path d="M72 778h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="819" font-size="23" fill="#566983" font-weight="400">Compose: Keycloak и Vault. Ключ модели поступает из локального файла вне Git.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">15 / 26</text></g></svg>