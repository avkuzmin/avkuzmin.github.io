<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Выбор объекта и уточнение параметров</title><desc id="desc">MVP · предложение модели проверяет сервер; изменение подтверждает пользователь</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">ВСПОМОГАТЕЛЬНЫЕ СЛАЙДЫ  /  IMPACT ASSISTANT</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Выбор объекта и уточнение параметров</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">MVP · предложение модели проверяет сервер; изменение подтверждает пользователь</text><rect x="112" y="220" width="236" height="66" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="132" y="247" font-size="20" fill="#17263D" font-weight="400">Пользователь</text><text x="132" y="271" font-size="20" fill="#17263D" font-weight="400">через UI</text><path d="M230 286V756" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><rect x="682" y="220" width="236" height="66" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="702" y="247" font-size="20" fill="#17263D" font-weight="400">Приложение</text><text x="702" y="271" font-size="20" fill="#17263D" font-weight="400">подготовка изменения</text><path d="M800 286V756" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><rect x="1252" y="220" width="236" height="66" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="1272" y="247" font-size="20" fill="#17263D" font-weight="400">Знания</text><text x="1272" y="271" font-size="20" fill="#17263D" font-weight="400">граф и артефакты</text><path d="M1370 286V756" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><rect x="95" y="298" width="835" height="112" fill="none" stroke="#566983" stroke-width="1.5"/><rect x="95" y="298" width="297" height="26" rx="0" fill="#F6F8FC" stroke="#566983" stroke-width="2"/><text x="105" y="317" font-size="17" fill="#315CCB" font-weight="600">opt · нужен выбор объекта</text><rect x="95" y="502" width="1425" height="177" fill="none" stroke="#566983" stroke-width="1.5"/><rect x="95" y="502" width="330" height="26" rx="0" fill="#F6F8FC" stroke="#566983" stroke-width="2"/><text x="105" y="521" font-size="17" fill="#315CCB" font-weight="600">loop · не хватает параметров</text><path d="M800 353H230" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="515" y="344" text-anchor="middle" font-size="20" fill="#17263D">Предложить объекты для выбора</text><path d="M230 391H800" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="515" y="382" text-anchor="middle" font-size="20" fill="#17263D">Выбранный ID и selection_revision</text><path d="M800 435H1370" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="1085" y="426" text-anchor="middle" font-size="20" fill="#17263D">Проверить объект, права и данные «было»</text><path d="M1370 478H800" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1085" y="469" text-anchor="middle" font-size="20" fill="#17263D">Исходные значения, источники или пробелы</text><path d="M800 554H230" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="515" y="545" text-anchor="middle" font-size="20" fill="#17263D">Вопрос о недостающем новом значении</text><path d="M230 596H800" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="515" y="587" text-anchor="middle" font-size="20" fill="#17263D">Ответ пользователя</text><path d="M800 629h25v20h-25" fill="none" stroke="#315CCB" stroke-width="2" marker-end="url(#arrow)"/><text x="838" y="644" font-size="20" fill="#17263D" font-weight="400">Проверить ответ и основание</text><path d="M800 733H230" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="515" y="724" text-anchor="middle" font-size="20" fill="#17263D">Резюме «было → станет» и ревизии</text><text x="72" y="794" font-size="23" fill="#566983" font-weight="400">Нет объекта, исходных сведений или доступа — резюме к запуску не готово.</text><text x="72" y="826" font-size="23" fill="#566983" font-weight="400">Структурированный ответ не требует LLM. Изменились существенные данные — уточнить заново.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">24 / 25</text></g></svg>