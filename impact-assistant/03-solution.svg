<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">От вопроса до отчёта с основаниями</title><desc id="desc">Пользователь описывает изменение; ассистент проверяет связанные системы</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">IMPACT ASSISTANT  /  ДИПЛОМНЫЙ ПРОЕКТ</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">От вопроса до отчёта с основаниями</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Пользователь описывает изменение; ассистент проверяет связанные системы</text><text x="72" y="285" font-size="30" fill="#087F86" font-weight="700">01</text><text x="150" y="285" font-size="33" fill="#17263D" font-weight="600">Уточняет объект и параметры</text><text x="150" y="332" font-size="25" fill="#566983" font-weight="400">Находит объект в знаниях, уточняет неизвестное, запрашивает подтверждение.</text><path d="M150 361h1378" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="413" font-size="30" fill="#087F86" font-weight="700">02</text><text x="150" y="413" font-size="33" fill="#17263D" font-weight="600">Проверяет зависимости</text><text x="150" y="460" font-size="25" fill="#566983" font-weight="400">Правила оценивают найденные связи и ограничения.</text><path d="M150 489h1378" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="541" font-size="30" fill="#087F86" font-weight="700">03</text><text x="150" y="541" font-size="33" fill="#17263D" font-weight="600">Добавляет отдельный взгляд модели</text><text x="150" y="588" font-size="25" fill="#566983" font-weight="400">LLM изучает разрешённые исходники; её ответ проходит проверку.</text><path d="M150 617h1378" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="669" font-size="30" fill="#087F86" font-weight="700">04</text><text x="150" y="669" font-size="33" fill="#17263D" font-weight="600">Сохраняет результат</text><text x="150" y="716" font-size="25" fill="#566983" font-weight="400">Отчёт показывает приложения, основания и недостающие сведения.</text><path d="M150 745h1378" stroke="#D6E0ED" stroke-width="2"/><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Решение</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">03 / 22</text></g></svg>