<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Сохранённый анализ и согласованность API</title><desc id="desc">Чтение сохранённого отчёта и новый анализ — разные операции</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">IMPACT ASSISTANT  /  ДИПЛОМНЫЙ ПРОЕКТ</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Сохранённый анализ и согласованность API</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Чтение сохранённого отчёта и новый анализ — разные операции</text><rect x="72" y="290" width="355" height="143" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="96" y="318" font-size="17" fill="#315CCB" font-weight="700">01 · ПРИНЯТ</text><text x="96" y="357" font-size="27" fill="#17263D" font-weight="700">queued</text><text x="96" y="389" font-size="22" fill="#566983" font-weight="400">Ресурс и работа сохраняются</text><text x="96" y="416" font-size="22" fill="#566983" font-weight="400">одной транзакцией PostgreSQL</text><rect x="574" y="290" width="355" height="143" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="598" y="318" font-size="17" fill="#315CCB" font-weight="700">02 · ВЫПОЛНЯЕТСЯ</text><text x="598" y="357" font-size="27" fill="#17263D" font-weight="700">running</text><text x="598" y="389" font-size="22" fill="#566983" font-weight="400">Исполнитель получает работу</text><text x="598" y="416" font-size="22" fill="#566983" font-weight="400">с ограниченным правом записи</text><rect x="1076" y="290" width="450" height="143" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="1100" y="318" font-size="17" fill="#315CCB" font-weight="700">03 · ЗАВЕРШЁН</text><text x="1100" y="357" font-size="27" fill="#17263D" font-weight="700">succeeded / failed</text><text x="1100" y="389" font-size="22" fill="#566983" font-weight="400">Отчёт опубликован</text><text x="1100" y="416" font-size="22" fill="#566983" font-weight="400">либо сохранён статус ошибки</text><path d="M427 363H574" fill="none" stroke="#315CCB" stroke-width="3" marker-end="url(#arrow)"/><path d="M929 363H1076" fill="none" stroke="#315CCB" stroke-width="3" marker-end="url(#arrow)"/><text x="72" y="517" font-size="22" fill="#315CCB" font-weight="700">Действие</text><text x="552" y="517" font-size="22" fill="#315CCB" font-weight="700">Гарантия</text><path d="M72 539h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="584" font-size="25" fill="#17263D" font-weight="400">Повтор того же запроса</text><text x="552" y="584" font-size="25" fill="#17263D" font-weight="400">Тот же ресурс; новый анализ не создаётся.</text><path d="M72 617h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="662" font-size="25" fill="#17263D" font-weight="400">Отмена</text><text x="552" y="662" font-size="25" fill="#17263D" font-weight="400">Состояние cancelled защищено от поздней публикации.</text><path d="M72 695h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="740" font-size="25" fill="#17263D" font-weight="400">Повторное чтение / WebSocket</text><text x="552" y="740" font-size="25" fill="#17263D" font-weight="400">Отдаётся сохранённое состояние; LLM не вызывается.</text><path d="M72 773h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="825" font-size="23" fill="#566983" font-weight="400">После обновления знаний нужен новый анализ. Прежний отчёт сохраняет основания прежнего решения.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">15 / 21</text></g></svg>