<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Как уточняется изменение</title><desc id="desc">POC · один процесс для HTTP, другой для заданий; оба внутри контейнера api</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">ВСПОМОГАТЕЛЬНЫЕ СЛАЙДЫ  /  IMPACT ASSISTANT</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Как уточняется изменение</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">POC · один процесс для HTTP, другой для заданий; оба внутри контейнера api</text><rect x="72" y="230" width="236" height="68" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="92" y="258" font-size="20" fill="#17263D" font-weight="400">Пользователь</text><text x="92" y="282" font-size="20" fill="#17263D" font-weight="400">через UI</text><path d="M190 298V764" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><rect x="472" y="230" width="236" height="68" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="492" y="258" font-size="20" fill="#17263D" font-weight="400">api</text><text x="492" y="282" font-size="20" fill="#17263D" font-weight="400">HTTP + исполнитель</text><path d="M590 298V764" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><rect x="872" y="230" width="236" height="68" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="892" y="258" font-size="20" fill="#17263D" font-weight="400">Знания</text><text x="892" y="282" font-size="20" fill="#17263D" font-weight="400">Neo4j / pgvector / S3</text><path d="M990 298V764" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><rect x="1272" y="230" width="236" height="68" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="1292" y="258" font-size="20" fill="#17263D" font-weight="400">Модели</text><text x="1292" y="282" font-size="20" fill="#17263D" font-weight="400">Yandex AI Studio</text><path d="M1390 298V764" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><path d="M190 330H590" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="390" y="321" text-anchor="middle" font-size="20" fill="#17263D">Описать изменение</text><path d="M590 374H190" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="390" y="365" text-anchor="middle" font-size="20" fill="#17263D">202 · задача подготовки</text><path d="M590 420H1390" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="990" y="411" text-anchor="middle" font-size="20" fill="#17263D">Эмбеддинг запроса для поиска</text><path d="M590 464H990" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="790" y="455" text-anchor="middle" font-size="20" fill="#17263D">Кандидаты: имя + смысл</text><path d="M590 508H1390" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="990" y="499" text-anchor="middle" font-size="20" fill="#17263D">Намерение + найденные кандидаты</text><path d="M190 550H590" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="390" y="541" text-anchor="middle" font-size="20" fill="#17263D">Опрос состояния</text><path d="M590 590H190" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="390" y="581" text-anchor="middle" font-size="20" fill="#17263D">Выберите объект</text><path d="M190 630H590" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="390" y="621" text-anchor="middle" font-size="20" fill="#17263D">Выбор → новая подготовка</text><path d="M590 682H990" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="790" y="673" text-anchor="middle" font-size="20" fill="#17263D">Проверить объект и данные «было»</text><path d="M590 734H190" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="390" y="725" text-anchor="middle" font-size="20" fill="#17263D">По опросу: вопросы или резюме</text><text x="72" y="795" font-size="23" fill="#566983" font-weight="400">Объект выбирает человек. Ответы на уточнения проходят повторную подготовку.</text><text x="72" y="827" font-size="23" fill="#566983" font-weight="400">Задания и ответы сохраняются в PostgreSQL; служебные ответы хранилищ и моделей опущены.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">23 / 24</text></g></svg>