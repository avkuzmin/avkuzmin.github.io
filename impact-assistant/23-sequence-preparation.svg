<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Поиск объекта и разбор намерения</title><desc id="desc">MVP · запрос из UI · поиск в одной версии знаний с проверкой доступа</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">ВСПОМОГАТЕЛЬНЫЕ СЛАЙДЫ  /  IMPACT ASSISTANT</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Поиск объекта и разбор намерения</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">MVP · запрос из UI · поиск в одной версии знаний с проверкой доступа</text><rect x="72" y="220" width="236" height="66" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="92" y="247" font-size="20" fill="#17263D" font-weight="400">Пользователь</text><text x="92" y="271" font-size="20" fill="#17263D" font-weight="400">через UI</text><path d="M190 286V756" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><rect x="472" y="220" width="236" height="66" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="492" y="247" font-size="20" fill="#17263D" font-weight="400">Приложение</text><text x="492" y="271" font-size="20" fill="#17263D" font-weight="400">подготовка изменения</text><path d="M590 286V756" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><rect x="872" y="220" width="236" height="66" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="892" y="247" font-size="20" fill="#17263D" font-weight="400">Знания</text><text x="892" y="271" font-size="20" fill="#17263D" font-weight="400">граф и векторы</text><path d="M990 286V756" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><rect x="1272" y="220" width="236" height="66" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="1292" y="247" font-size="20" fill="#17263D" font-weight="400">GPUStack</text><text x="1292" y="271" font-size="20" fill="#17263D" font-weight="400">эмбеддинги + LLM</text><path d="M1390 286V756" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><rect x="90" y="334" width="1430" height="240" fill="none" stroke="#566983" stroke-width="1.5"/><rect x="90" y="334" width="187" height="26" rx="0" fill="#F6F8FC" stroke="#566983" stroke-width="2"/><text x="100" y="353" font-size="17" fill="#315CCB" font-weight="600">par · две ветки</text><path d="M90 415h1430" stroke="#566983" stroke-dasharray="5 5"/><path d="M190 318H590" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="390" y="309" text-anchor="middle" font-size="20" fill="#17263D">Описание изменения</text><path d="M590 366H990" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="790" y="357" text-anchor="middle" font-size="20" fill="#17263D">Поиск по имени / идентификатору</text><path d="M990 400H590" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="790" y="391" text-anchor="middle" font-size="20" fill="#17263D">Кандидаты по имени</text><path d="M590 443H1390" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="990" y="434" text-anchor="middle" font-size="20" fill="#17263D">Текст запроса → модель эмбеддингов</text><path d="M1390 481H590" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="990" y="472" text-anchor="middle" font-size="20" fill="#17263D">Вектор запроса</text><path d="M590 519H990" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="790" y="510" text-anchor="middle" font-size="20" fill="#17263D">Поиск по вектору; версия и доступ</text><path d="M990 557H590" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="790" y="548" text-anchor="middle" font-size="20" fill="#17263D">Кандидаты по смыслу</text><path d="M590 583h25v20h-25" fill="none" stroke="#315CCB" stroke-width="2" marker-end="url(#arrow)"/><text x="628" y="598" font-size="20" fill="#17263D" font-weight="400">Объединить кандидатов, проверить доступ</text><path d="M590 634H1390" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="990" y="625" text-anchor="middle" font-size="20" fill="#17263D">Текст + кандидаты → LLM намерения</text><path d="M1390 672H590" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="990" y="663" text-anchor="middle" font-size="20" fill="#17263D">Действие, параметры, неизвестные значения</text><path d="M590 700h25v20h-25" fill="none" stroke="#315CCB" stroke-width="2" marker-end="url(#arrow)"/><text x="628" y="715" font-size="20" fill="#17263D" font-weight="400">Проверить предложение модели</text><path d="M590 750H190" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="390" y="741" text-anchor="middle" font-size="20" fill="#17263D">Результат → выбор и уточнение</text><text x="72" y="794" font-size="23" fill="#566983" font-weight="400">Внутри par: поиск по имени независим от ветки «эмбеддинг → векторный поиск».</text><text x="72" y="826" font-size="23" fill="#566983" font-weight="400">UI получает проверенный результат; выбор объекта и вопросы раскрыты на следующем слайде.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">23 / 25</text></g></svg>