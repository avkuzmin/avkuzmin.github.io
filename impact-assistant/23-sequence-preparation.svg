<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Поиск объекта и разбор намерения</title><desc id="desc">MVP · после запроса пользователя · одна версия знаний и проверенные права</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">ВСПОМОГАТЕЛЬНЫЕ СЛАЙДЫ  /  IMPACT ASSISTANT</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Поиск объекта и разбор намерения</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">MVP · после запроса пользователя · одна версия знаний и проверенные права</text><rect x="112" y="220" width="236" height="66" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="132" y="247" font-size="20" fill="#17263D" font-weight="400">Приложение</text><text x="132" y="271" font-size="20" fill="#17263D" font-weight="400">подготовка изменения</text><path d="M230 286V756" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><rect x="682" y="220" width="236" height="66" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="702" y="247" font-size="20" fill="#17263D" font-weight="400">Знания</text><text x="702" y="271" font-size="20" fill="#17263D" font-weight="400">граф и векторы</text><path d="M800 286V756" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><rect x="1252" y="220" width="236" height="66" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="1272" y="247" font-size="20" fill="#17263D" font-weight="400">GPUStack</text><text x="1272" y="271" font-size="20" fill="#17263D" font-weight="400">эмбеддинги + LLM</text><path d="M1370 286V756" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><rect x="90" y="298" width="1430" height="253" fill="none" stroke="#566983" stroke-width="1.5"/><rect x="90" y="298" width="187" height="26" rx="0" fill="#F6F8FC" stroke="#566983" stroke-width="2"/><text x="100" y="317" font-size="17" fill="#315CCB" font-weight="600">par · две ветки</text><path d="M90 390h1430" stroke="#566983" stroke-dasharray="5 5"/><path d="M230 336H800" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="515" y="327" text-anchor="middle" font-size="20" fill="#17263D">Поиск по имени и идентификатору</text><path d="M800 374H230" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="515" y="365" text-anchor="middle" font-size="20" fill="#17263D">Кандидаты по имени</text><path d="M230 422H1370" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="800" y="413" text-anchor="middle" font-size="20" fill="#17263D">Текст запроса → модель эмбеддингов</text><path d="M1370 460H230" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="800" y="451" text-anchor="middle" font-size="20" fill="#17263D">Вектор запроса</text><path d="M230 498H800" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="515" y="489" text-anchor="middle" font-size="20" fill="#17263D">Поиск по вектору в разрешённой версии</text><path d="M800 536H230" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="515" y="527" text-anchor="middle" font-size="20" fill="#17263D">Кандидаты по смыслу</text><path d="M230 573h25v20h-25" fill="none" stroke="#315CCB" stroke-width="2" marker-end="url(#arrow)"/><text x="268" y="588" font-size="20" fill="#17263D" font-weight="400">Объединить, убрать дубли, проверить доступ</text><path d="M230 638H1370" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="800" y="629" text-anchor="middle" font-size="20" fill="#17263D">Текст + кандидаты → LLM намерения</text><path d="M1370 681H230" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="800" y="672" text-anchor="middle" font-size="20" fill="#17263D">Действие, параметры и неизвестные значения</text><path d="M230 720h25v20h-25" fill="none" stroke="#315CCB" stroke-width="2" marker-end="url(#arrow)"/><text x="268" y="735" font-size="20" fill="#17263D" font-weight="400">Проверить предложение → перейти к уточнению</text><text x="72" y="794" font-size="23" fill="#566983" font-weight="400">Внутри par: поиск по имени независим от ветки «эмбеддинг → векторный поиск».</text><text x="72" y="826" font-size="23" fill="#566983" font-weight="400">Модель получает описания кандидатов; векторная близость не подтверждает выбор объекта.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">23 / 25</text></g></svg>