<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Подготовка изменения: задание и опрос UI</title><desc id="desc">MVP · API проверяет доступ; поиск и модель выполняются в фоне</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">ВСПОМОГАТЕЛЬНЫЕ СЛАЙДЫ  /  IMPACT ASSISTANT</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Подготовка изменения: задание и опрос UI</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">MVP · API проверяет доступ; поиск и модель выполняются в фоне</text><rect x="112" y="220" width="236" height="66" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="132" y="247" font-size="20" fill="#17263D" font-weight="400">Пользователь</text><text x="132" y="271" font-size="20" fill="#17263D" font-weight="400">через UI</text><path d="M230 286V767" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><rect x="682" y="220" width="236" height="66" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="702" y="247" font-size="20" fill="#17263D" font-weight="400">Приложение</text><text x="702" y="271" font-size="20" fill="#17263D" font-weight="400">API + подготовка</text><path d="M800 286V767" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><rect x="1252" y="220" width="236" height="66" rx="12" fill="#FFFFFF" stroke="#D6E0ED" stroke-width="2"/><text x="1272" y="247" font-size="20" fill="#17263D" font-weight="400">PostgreSQL</text><text x="1272" y="271" font-size="20" fill="#17263D" font-weight="400">задания и результаты</text><path d="M1370 286V767" stroke="#D6E0ED" stroke-width="2" stroke-dasharray="7 7"/><rect x="90" y="463" width="1430" height="310" fill="none" stroke="#566983" stroke-width="1.5"/><rect x="90" y="463" width="297" height="26" rx="0" fill="#F6F8FC" stroke="#566983" stroke-width="2"/><text x="100" y="482" font-size="17" fill="#315CCB" font-weight="600">par · фоновая работа / UI</text><path d="M90 657h1430" stroke="#566983" stroke-dasharray="5 5"/><rect x="90" y="657" width="1430" height="116" fill="none" stroke="#566983" stroke-width="1.5"/><rect x="1120" y="657" width="363" height="26" rx="0" fill="#F6F8FC" stroke="#566983" stroke-width="2"/><text x="1130" y="676" font-size="17" fill="#315CCB" font-weight="600">loop · до готовности или ошибки</text><path d="M230 326H800" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="515" y="317" text-anchor="middle" font-size="20" fill="#17263D">POST · описание изменения</text><path d="M800 365H1370" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="1085" y="356" text-anchor="middle" font-size="20" fill="#17263D">Сохранить задание</text><path d="M1370 404H800" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1085" y="395" text-anchor="middle" font-size="20" fill="#17263D">Задание сохранено</text><path d="M800 443H230" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="515" y="434" text-anchor="middle" font-size="20" fill="#17263D">202 · preparation_id</text><path d="M800 585H1370" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="1085" y="576" text-anchor="middle" font-size="20" fill="#17263D">Сохранить результат подготовки</text><path d="M1370 626H800" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1085" y="617" text-anchor="middle" font-size="20" fill="#17263D">Результат и статус сохранены</text><path d="M230 714H800" stroke="#315CCB" stroke-width="2"  marker-end="url(#arrow)"/><text x="515" y="705" text-anchor="middle" font-size="20" fill="#17263D">GET · состояние подготовки</text><path d="M800 755H230" stroke="#315CCB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="515" y="746" text-anchor="middle" font-size="20" fill="#17263D">Статус; при готовности — результат</text><text x="72" y="805" font-size="23" fill="#566983" font-weight="400">UI опрашивает сохранённое состояние; GET не запускает поиск или модель заново.</text><text x="72" y="837" font-size="23" fill="#566983" font-weight="400">После готовности — выбор и уточнение (слайд 24). Период опроса MVP задаётся отдельно.</text><rect x="660" y="502" width="835" height="53" rx="0" fill="#EDF2FB" stroke="#566983" stroke-width="2"/><text x="678" y="536" font-size="23" fill="#17263D" font-weight="400">ref · Поиск и разбор намерения — слайд 26</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">23 / 26</text></g></svg>