<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Что используется в локальном POC</title><desc id="desc">Фактический стек приложения и двух моделей</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">ВСПОМОГАТЕЛЬНЫЕ СЛАЙДЫ  /  IMPACT ASSISTANT</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">Что используется в локальном POC</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Фактический стек приложения и двух моделей</text><text x="72" y="265" font-size="22" fill="#315CCB" font-weight="700">Компонент</text><text x="562" y="265" font-size="22" fill="#315CCB" font-weight="700">Реализация</text><path d="M72 287h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="323" font-size="28" fill="#17263D" font-weight="400">Приложение и UI</text><text x="562" y="323" font-size="28" fill="#17263D" font-weight="400">Python / Flask, HTML, CSS, JavaScript</text><text x="562" y="360" font-size="28" fill="#17263D" font-weight="400">API и WebSocket</text><path d="M72 404h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="440" font-size="28" fill="#17263D" font-weight="400">Генеративная модель</text><text x="562" y="440" font-size="28" fill="#17263D" font-weight="400">Qwen3.8-27B, GGUF Q4_K_M</text><text x="562" y="477" font-size="28" fill="#17263D" font-weight="400">llama.cpp b10809 / Metal</text><path d="M72 521h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="557" font-size="28" fill="#17263D" font-weight="400">Эмбеддинги</text><text x="562" y="557" font-size="28" fill="#17263D" font-weight="400">Qwen3-VL-Embedding-8B</text><text x="562" y="594" font-size="28" fill="#17263D" font-weight="400">PyTorch / Transformers, MPS FP16</text><path d="M72 638h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="674" font-size="28" fill="#17263D" font-weight="400">Хранилища</text><text x="562" y="674" font-size="28" fill="#17263D" font-weight="400">PostgreSQL / pgvector, Neo4j</text><text x="562" y="711" font-size="28" fill="#17263D" font-weight="400">S3 через SeaweedFS</text><path d="M72 755h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="779" font-size="23" fill="#566983" font-weight="400">POC: векторный поиск помогает выбрать объект; контекст анализа — граф и исходники.</text><text x="72" y="811" font-size="23" fill="#566983" font-weight="400">Корпоративные IAM, GPUStack и сервис синхронизации относятся к целевому MVP.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">18 / 19</text></g></svg>