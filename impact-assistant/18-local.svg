<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">POC с внешними моделями</title><desc id="desc">Приложение на ноутбуке, инференс в Yandex Cloud</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9Z" fill="#315CCB"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1600" height="900" fill="#F6F8FC"/><text x="72" y="64" font-size="18" fill="#315CCB" font-weight="700">ВСПОМОГАТЕЛЬНЫЕ СЛАЙДЫ  /  IMPACT ASSISTANT</text><text x="72" y="139" font-size="46" fill="#17263D" font-weight="700">POC с внешними моделями</text><text x="72" y="189" font-size="25" fill="#566983" font-weight="400">Приложение на ноутбуке, инференс в Yandex Cloud</text><text x="72" y="250" font-size="22" fill="#315CCB" font-weight="700">Компонент</text><text x="562" y="250" font-size="22" fill="#315CCB" font-weight="700">Реализация</text><path d="M72 272h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="306" font-size="27" fill="#17263D" font-weight="400">Запуск и интерфейс</text><text x="562" y="306" font-size="27" fill="#17263D" font-weight="400">Compose; Python / Flask</text><text x="562" y="340" font-size="27" fill="#17263D" font-weight="400">Анализы и подготовка знаний оператором</text><path d="M72 368h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="402" font-size="27" fill="#17263D" font-weight="400">Генерация</text><text x="562" y="402" font-size="27" fill="#17263D" font-weight="400">gpt-oss-20b через Yandex AI Studio</text><path d="M72 464h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="498" font-size="27" fill="#17263D" font-weight="400">Эмбеддинги</text><text x="562" y="498" font-size="27" fill="#17263D" font-weight="400">Yandex Text Embeddings v2 doc/query</text><text x="562" y="532" font-size="27" fill="#17263D" font-weight="400">256 измерений; новая версия индекса</text><path d="M72 560h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="594" font-size="27" fill="#17263D" font-weight="400">Вход и секрет модели</text><text x="562" y="594" font-size="27" fill="#17263D" font-weight="400">Keycloak; Vault dev в памяти</text><path d="M72 656h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="690" font-size="27" fill="#17263D" font-weight="400">Хранилища приложения</text><text x="562" y="690" font-size="27" fill="#17263D" font-weight="400">PostgreSQL / pgvector, Neo4j</text><text x="562" y="724" font-size="27" fill="#17263D" font-weight="400">S3 через SeaweedFS</text><path d="M72 752h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="787" font-size="23" fill="#566983" font-weight="400">docker compose up -d --build</text><text x="72" y="819" font-size="23" fill="#566983" font-weight="400">Нужны интернет и локальный файл API-ключа вне Git. MVP по-прежнему использует GPUStack.</text><path d="M72 850h1456" stroke="#D6E0ED" stroke-width="2"/><text x="72" y="882" font-size="17" fill="#566983" font-weight="400">OTUS · AI Architect   |   Подробности</text><text x="1430" y="882" font-size="17" fill="#566983" font-weight="400">18 / 21</text></g></svg>